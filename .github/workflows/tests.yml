# Runs the test suite on every pull request, and on main after merge.
#
# WHY THE FULL requirements.txt AND NOT A TRIMMED SUBSET. py-clob-client-v2
# is documented there as "only needed for auto execution mode", and
# clients/wallet_client.py imports it LAZILY for exactly that reason -- so
# it is tempting to leave it out of a test-only install. Measured: doing so
# fails 15 tests in tests/test_live_execution.py, which drive the real
# order-build path through wallet_client._clob() and get the RuntimeError it
# raises when the SDK is absent. The suite needs the same dependency set the
# daemon box installs.
#
# pytest is installed SEPARATELY rather than added to requirements.txt: that
# file is what deploy/deploy_daemon.sh puts on the production box, and a test
# runner does not belong there.

name: tests

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        # tests/conftest.py puts THIS directory on sys.path and says to run
        # from it; the repo root has no conftest and would collect nothing.
        working-directory: weather-forecast

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          # Matches the interpreter the suite is verified against. The deploy
          # script builds its venv from whatever `python3` the box carries
          # rather than pinning, so this is the tighter of the two.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: weather-forecast/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the test suite
        run: python -m pytest tests -q

      # Mirrors deploy/deploy_daemon.sh, which smoke-checks its entry points
      # after installing. A module that breaks at IMPORT is invisible to the
      # suite unless some test happens to import it, and the daemon finds out
      # at deploy time instead. Cheap here, expensive there.
      - name: Smoke-check the operator entry points
        run: |
          python scheduler.py --help > /dev/null
          python paper_trading_report.py --help > /dev/null
          python promotion_dossier.py --help > /dev/null
